[project]
name = "logicmate-backend"
version = "1.0.0"
description = "Interactive Assistance Bot Backend Server on Algorithm Programs and Programming Flowcharts for the course “Introduction to Algorithmics”"
authors = [
    {name = "NightmareVCO",email = "vladimircuriel@outlook.com"}
]
readme = "README.md"
requires-python = "==3.10.18"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn[standard] (>=0.34.2,<0.35.0)",
    "ruff (>=0.11.10,<0.12.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)"
    "celery (>=5.3.6,<6.0.0)",   
    "redis (>=5.0.1,<6.0.0)",  
    "flower (>=2.0.1,<3.0.0)"  
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  { include = "logicmate_backend", from = "src" }
]